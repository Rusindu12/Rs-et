plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rset.trading'
    compileSdk 34

    defaultConfig {
        applicationId "com.rset.trading"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // No external dependencies - pure platform Android (WebView based)
}

// intentionally empty dependencies block (zero external libs)
dependencies {
}
