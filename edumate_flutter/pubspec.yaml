name: edumate_ai
description: EduMate AI — a Sinhala-first Sri Lankan student study companion.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.7.0
  google_fonts: ^6.2.1
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.2
  firebase_storage: ^12.3.7
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  path_provider: ^2.1.5
  flutter_pdfview: ^1.3.2
  fl_chart: ^0.70.2
  lottie: ^3.2.0
  confetti: ^0.7.0
  intl: ^0.19.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
