name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug & release APKs
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/BinanceAITrader-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/BinanceAITrader-release.apk
          ls -la out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BinanceAITrader-APKs
          path: out/*.apk
          retention-days: 30

      - name: Publish GitHub pre-release with APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Binance AI Trader build ${{ github.run_number }}
          prerelease: true
          files: out/*.apk
          body: |
            Automated build from `${{ github.ref_name }}` @ ${{ github.sha }}
            - **BinanceAITrader-release.apk** – install this one (signed, minified)
            - BinanceAITrader-debug.apk – debug build (WebView debugging enabled)
