name: Build APK

on:
  push:
    branches:
      - arena/01a066ef-rs-et
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: ls -lh app/build/outputs/apk/debug/

      - name: Commit APK artifact
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/RS-TradingAI.apk
          git config user.name "arena-build-bot"
          git config user.email "arena-build-bot@users.noreply.github.com"
          git add apk/RS-TradingAI.apk
          git commit -m "chore: build APK artifact [skip ci]" || echo "No changes to commit"
          git push
