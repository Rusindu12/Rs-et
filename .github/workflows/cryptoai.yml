name: CryptoAI PRO APK

on:
  push:
    branches: ["**"]
    paths:
      - "crypto-app/**"
      - ".github/workflows/cryptoai.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # for the APK release
  issues: write     # for auto failure reports

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check the web layer (assets must be the real app, not a placeholder)
        working-directory: crypto-app/app/src/main/assets
        run: |
          set -e
          node --check ta.js
          node --check app.js
          for f in index.html app.js ta.js; do test -s "$f" || { echo "missing $f"; exit 1; }; done
          test "$(wc -c < index.html)" -gt 20000 || { echo "index.html looks like a placeholder"; exit 1; }
          grep -q "ta.js" index.html && grep -q "app.js" index.html
          grep -q "sigVerdict" index.html && grep -q "botLog" index.html
          grep -q "function analyze" ta.js && grep -q "function botTick" app.js
          echo "assets OK: index.html $(wc -c < index.html) bytes · app.js $(wc -c < app.js) bytes · ta.js $(wc -c < ta.js) bytes"

      - name: Build APK (debug-signed, installable)
        working-directory: crypto-app
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report failure log as GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### APK build failed"
            echo "Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "**Kotlin errors (e: lines):**"
            echo '```'
            grep -E "^e: |error:" /tmp/build.log | head -40
            echo '```'
            echo "**Log tail:**"
            echo '```gradle'
            tail -c 3500 /tmp/build.log
            echo '```'
          } | gh issue create \
                --title "❌ CryptoAI APK build failed (${GITHUB_SHA:0:7})" \
                --body-file - \
                --repo "${REPO}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: CryptoAI-PRO-debug-apk
          path: crypto-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases (permanent link)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          cp crypto-app/app/build/outputs/apk/debug/*.apk /tmp/CryptoAI-PRO.apk
          gh release view cryptoai-apk-latest --repo "${REPO}" >/dev/null 2>&1 || \
            gh release create cryptoai-apk-latest --repo "${REPO}" \
                --title "CryptoAI PRO — Android APK (latest debug build)" \
                --notes "Auto-built from main branch. Debug-signed, installable. Commit: ${SHA}"
          gh release upload cryptoai-apk-latest /tmp/CryptoAI-PRO.apk --repo "${REPO}" --clobber
          echo "APK is live at: https://github.com/${REPO}/releases/tag/cryptoai-apk-latest"
