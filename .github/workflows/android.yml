name: Android APK

on:
  push:
    branches: ["**"]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK (debug-signed, installable)
        working-directory: android-app
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report failure log as GitHub issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "### APK build failed"
            echo "Run: https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "**Kotlin errors (e: lines):**"
            echo '```'
            grep -E "^e: |error:" /tmp/build.log | head -40
            echo '```'
            echo "**Log tail:**"
            echo '```gradle'
            tail -c 3500 /tmp/build.log
            echo '```'
          } | gh issue create \
                --title "❌ CI APK build failed (${GITHUB_SHA:0:7})" \
                --body-file - \
                --repo "${REPO}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: RS-AI-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
