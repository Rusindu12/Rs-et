name: Build EduMate AI APK

on:
  push:
    branches:
      - arena/fd6fc0eb-rs-et
    paths:
      - "edumate_flutter/**"
      - ".github/workflows/edumate-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Android arm64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('edumate_flutter/pubspec.yaml') }}

      - name: Generate Android platform files
        working-directory: edumate_flutter
        run: flutter create --platforms android .

      - name: Add ML Kit recognizer models
        working-directory: edumate_flutter
        shell: bash
        run: |
          if [[ -f android/app/build.gradle.kts ]]; then
            cat >> android/app/build.gradle.kts <<'EOF'

          dependencies {
              implementation("com.google.mlkit:text-recognition-chinese:16.0.1")
              implementation("com.google.mlkit:text-recognition-devanagari:16.0.1")
              implementation("com.google.mlkit:text-recognition-japanese:16.0.1")
              implementation("com.google.mlkit:text-recognition-korean:16.0.1")
          }
          EOF
          elif [[ -f android/app/build.gradle ]]; then
            cat >> android/app/build.gradle <<'EOF'
          dependencies {
              implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
              implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
              implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
              implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
          }
          EOF
          else
            echo "Android app Gradle build file not found" >&2
            exit 1
          fi

      - name: Resolve Flutter packages
        working-directory: edumate_flutter
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: edumate_flutter
        run: flutter test

      - name: Build installable arm64 APK
        working-directory: edumate_flutter
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee /tmp/edumate-flutter-build.log

      - name: Surface build failure details
        if: failure()
        shell: bash
        run: |
          if [[ -f /tmp/edumate-flutter-build.log ]]; then
            python - <<'PY' > /tmp/edumate-build-diagnostics.txt
          from pathlib import Path
          text = Path('/tmp/edumate-flutter-build.log').read_text(errors='replace').replace('\r', '\n')
          lines = [line.strip() for line in text.splitlines() if line.strip()]
          markers = ('error', 'exception', 'failed', 'unable', 'denied', 'not found', 'caused by', 'failure:')
          relevant = [line for line in lines if any(marker in line.lower() for marker in markers)]
          chosen = relevant[-25:] if relevant else lines[-35:]
          print(' | '.join(chosen)[:3500])
          PY
            details="$(cat /tmp/edumate-build-diagnostics.txt)"
            echo "::error title=EduMate APK build diagnostics::$details"
          else
            echo "::error title=EduMate APK build diagnostics::Flutter build log not found."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edumate-ai-android-arm64
          path: edumate_flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
